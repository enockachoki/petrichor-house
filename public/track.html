<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Track your order · The Petrichor Kakamega</title>
  <meta name="description" content="Follow your food order from The Petrichor kitchen: payment, cooking, delivery run and every item you ordered." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230e1a15'/%3E%3Cpath d='M32 12c8 12 14 20 14 28a14 14 0 0 1-28 0c0-8 6-16 14-28z' fill='%23b08d57'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="track-page">
  <nav class="nav solid" id="nav">
    <div class="container">
      <a href="/" class="brand">
        <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6c9 14 16 23 16 33a16 16 0 0 1-32 0c0-10 7-19 16-33z" fill="none" stroke="#d9a866" stroke-width="3"/><path d="M32 26v28M32 38l-8-7M32 44l8-7" stroke="#d9a866" stroke-width="2.5" fill="none"/></svg>
        <span>THE PETRICHOR<small>Kakamega · Kenya</small></span>
      </a>
      <div class="nav-links open-always">
        <a href="/#menu">Menu</a>
        <a class="btn small" href="/#delivery">Order food</a>
      </div>
    </div>
  </nav>

  <header class="track-hero dark">
    <div class="container track-grid">
      <div>
        <p class="eyebrow">Your order</p>
        <h1 id="tTitle">Track your food</h1>
        <p class="lede" id="tLede">Enter the reference from your order (it starts with DL) to see what's cooking.</p>
        <form class="lookup" id="trackForm">
          <input name="ref" placeholder="DL…" required autocomplete="off" />
          <button class="btn" type="submit">Track</button>
        </form>
        <div class="recent" id="recent"></div>
      </div>
      <div class="stage" id="stage" aria-live="polite"></div>
    </div>
  </header>

  <main class="section track-details" id="details" hidden>
    <div class="container">
      <ol class="timeline" id="timeline"></ol>
      <div class="track-cards">
        <div class="panel">
          <h4>What you ordered</h4>
          <ul class="basket-lines" id="items"></ul>
          <div class="totals" id="sums"></div>
        </div>
        <div class="panel">
          <h4>Delivery</h4>
          <ul class="facts-list" id="facts"></ul>
          <div id="payBox"></div>
          <div class="contact-actions" style="margin-top:20px">
            <a class="btn ghost small" href="tel:+254796306263">Call the kitchen</a>
            <a class="btn ghost small" id="waLink" href="https://wa.me/254796306263" target="_blank" rel="noopener">WhatsApp us</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="quick" aria-label="Quick contact">
    <a class="quick-btn wa" href="https://wa.me/254796306263?text=Hello%20The%20Petrichor" target="_blank" rel="noopener" aria-label="WhatsApp us"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.6-.3z"/></svg></a>
    <a class="quick-btn call" href="tel:+254796306263" aria-label="Call us"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></a>
  </div>

  <script src="/pay.js"></script>
  <script src="/track.js"></script>
</body>
</html>
