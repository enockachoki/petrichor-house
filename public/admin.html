<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Petrichor Staff</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230e1a15'/%3E%3Cpath d='M32 12c8 12 14 20 14 28a14 14 0 0 1-28 0c0-8 6-16 14-28z' fill='%23b08d57'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { background: #f1ede4; }
    /* ---------- login ---------- */
    .login { position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: #0b0b0b; padding: 16px; overflow: hidden; }
    .login-bg { position: absolute; inset: -4%; background: linear-gradient(180deg, rgba(10,10,10,.55), rgba(10,10,10,.92)), url('/photos/exterior.jpg') center/cover; animation: drift 24s ease-in-out infinite alternate; filter: saturate(.85); }
    @keyframes drift { from { transform: scale(1.04) translate(0, 0); } to { transform: scale(1.14) translate(-2%, -1.5%); } }
    #loginRain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .login-card { position: relative; width: min(400px, 100%); padding: 40px 34px 30px; border-radius: 14px; background: rgba(22,22,22,.58); border: 1px solid rgba(217,168,102,.22); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); color: var(--cream); box-shadow: 0 40px 80px -30px rgba(0,0,0,.8); animation: cardIn .9s cubic-bezier(.2,.8,.2,1) both; --brass: #d9a866; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(40px) scale(.96); filter: blur(6px); } }
    .login-card::before { content: ''; position: absolute; inset: -1px; border-radius: 14px; padding: 1px; background: conic-gradient(from var(--a, 0deg), transparent 0 70%, #d9a866 80%, transparent 90%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: orbit 5s linear infinite; pointer-events: none; }
    @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    @keyframes orbit { to { --a: 360deg; } }
    .login-mark { width: 54px; height: 54px; display: block; margin-bottom: 16px; fill: none; stroke: #d9a866; stroke-width: 2.6; stroke-linecap: round; }
    .login-mark .d1 { stroke-dasharray: 140; stroke-dashoffset: 140; animation: ink 1.6s .3s ease forwards; }
    .login-mark .d2 { stroke-dasharray: 60; stroke-dashoffset: 60; animation: ink 1s 1.3s ease forwards; }
    @keyframes ink { to { stroke-dashoffset: 0; } }
    .login-card h1 { font-family: var(--serif); font-weight: 400; font-size: 2.5rem; margin: 4px 0 2px; letter-spacing: .02em; }
    .login-card > * { animation: up .7s cubic-bezier(.2,.8,.2,1) both; }
    .login-card > :nth-child(2) { animation-delay: .15s; } .login-card > :nth-child(3) { animation-delay: .22s; } .login-card > :nth-child(4) { animation-delay: .29s; }
    .login-card > :nth-child(5) { animation-delay: .38s; } .login-card > :nth-child(6) { animation-delay: .46s; } .login-card > :nth-child(8) { animation-delay: .54s; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } }
    .login-sub { color: rgba(247,246,242,.6); margin: 0 0 26px; }
    .float { position: relative; display: block; margin-bottom: 16px; }
    .float input { width: 100%; padding: 22px 16px 8px; border-radius: 8px; border: 1px solid rgba(247,246,242,.16); background: rgba(255,255,255,.06); color: var(--cream); font: inherit; font-size: 1rem; outline: none; transition: border-color .25s, background .25s, box-shadow .25s; }
    .float.pw input { padding-right: 52px; }
    .float input:focus { border-color: #d9a866; background: rgba(255,255,255,.09); box-shadow: 0 0 0 4px rgba(217,168,102,.14); }
    .float span { position: absolute; left: 16px; top: 16px; font-size: .95rem; color: rgba(247,246,242,.55); pointer-events: none; transition: all .2s ease; }
    .float input:focus + span, .float input:not(:placeholder-shown) + span { top: 7px; font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; color: #d9a866; }
    .float input:-webkit-autofill { -webkit-text-fill-color: var(--cream); -webkit-box-shadow: 0 0 0 40px #1d1d1d inset; caret-color: var(--cream); }
    .peek { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; transition: background .2s; }
    .peek:hover { background: rgba(255,255,255,.08); }
    .peek svg { width: 22px; height: 22px; fill: none; stroke: rgba(247,246,242,.7); stroke-width: 1.7; stroke-linecap: round; }
    .peek .slash { stroke-dasharray: 23; stroke-dashoffset: 0; transition: stroke-dashoffset .3s ease; }
    .peek .pupil { transition: transform .3s ease; transform-origin: 12px 12px; }
    .peek.on svg { stroke: #d9a866; }
    .peek.on .slash { stroke-dashoffset: 23; }
    .peek.on .pupil { animation: look 3s ease-in-out; }
    @keyframes look { 15% { transform: translateX(-2px); } 45% { transform: translateX(2px); } 75% { transform: translateX(0) scale(1.15); } }
    .peek-bar { position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; border-radius: 2px; background: #d9a866; transform: scaleX(0); transform-origin: left; }
    .peek-bar.run { animation: drain 3s linear forwards; }
    @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    .caps { margin: -8px 0 12px; font-size: .8rem; color: #e8c08a; }
    .login-go { width: 100%; margin-top: 8px; padding: 15px; position: relative; overflow: hidden; }
    .login-go::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-20deg); animation: sheen 3.6s 1.8s ease-in-out infinite; }
    @keyframes sheen { 0% { left: -60%; } 40%, 100% { left: 130%; } }
    .login-go .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(18,18,18,.3); border-top-color: #121212; border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto; }
    .login-go.busy span { display: none; } .login-go.busy .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .login-card.shake { animation: shakeX .5s; }
    @keyframes shakeX { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
    .login-card.out { animation: away .6s cubic-bezier(.6,0,.4,1) forwards; }
    @keyframes away { to { opacity: 0; transform: translateY(-30px) scale(.94); filter: blur(4px); } }
    .login-card .error { color: #f0a59b; min-height: 1.2em; margin-top: 12px; font-size: .9rem; }
    .login-foot { margin: 14px 0 0; font-size: .85rem; } .login-foot a { color: rgba(247,246,242,.6); }
    .shell.enter { animation: fadeIn .6s ease; } @keyframes fadeIn { from { opacity: 0; } }
    .who { margin: -14px 0 18px; padding: 0 14px; font-size: .8rem; color: rgba(244,239,228,.6); }
    .who b { color: var(--brass-2); font-weight: 400; }
    @media (prefers-reduced-motion: reduce) { .login *, .login-bg, .login-card::before { animation: none !important; } .login-mark path { stroke-dashoffset: 0; } }
    .shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    aside { background: var(--forest); color: var(--cream); padding: 28px 18px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; }
    aside .brand { margin-bottom: 28px; font-size: 1.3rem; display: block; line-height: 1.3; }
    aside .brand small { margin-top: 6px; }
    aside button.navi { text-align: left; background: none; border: 0; color: rgba(244,239,228,.75); padding: 11px 14px; border-radius: var(--radius); cursor: pointer; letter-spacing: .12em; text-transform: uppercase; font-size: .72rem; }
    aside button.navi.active, aside button.navi:hover { background: rgba(176,141,87,.18); color: var(--brass-2); }
    aside .spacer { flex: 1; }
    main { padding: clamp(18px, 3vw, 40px); min-width: 0; }
    main h1 { font-size: 2.6rem; margin-bottom: 6px; }
    .sub { color: var(--muted); margin: 0 0 26px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .kpi { background: #fff; border-radius: var(--radius); padding: 20px; border: 1px solid var(--line); }
    .kpi span { font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
    .kpi b { display: block; font-family: var(--serif); font-size: 2.4rem; font-weight: 400; color: var(--moss); }
    .card { background: #fff; border-radius: var(--radius); border: 1px solid var(--line); padding: 20px; margin-bottom: 22px; overflow-x: auto; }
    .card h3 { font-size: 1.5rem; margin-bottom: 14px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    table.data { width: 100%; border-collapse: collapse; font-size: .9rem; }
    table.data th { text-align: left; font-weight: 500; font-size: .66rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    table.data td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    table.data input, table.data select { padding: 7px 9px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; width: 100%; min-width: 70px; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; background: #eee; white-space: nowrap; }
    .pill.paid { background: #dff0dc; color: #2a7d2e; }
    .pill.unpaid, .pill.awaiting_payment, .pill.pending { background: #fbeedd; color: #9a5a12; }
    .pill.failed { background: #f4dfdc; color: #8c3a31; }
    .pill.on_site { background: #e6e9ec; color: #4b5560; }
    .banner { background: #fbeedd; color: #6d4410; border-radius: 6px; padding: 12px 16px; margin: 0 0 20px; font-size: .92rem; }
    .pill.confirmed, .pill.received, .pill.active { background: #e3efe3; color: #2e6a3b; }
    .pill.checked_in, .pill.seated, .pill.preparing, .pill.out_for_delivery { background: #f6ecd8; color: #8a5f1d; }
    .pill.cancelled, .pill.no_show, .pill.maintenance { background: #f4dfdc; color: #8c3a31; }
    .pill.checked_out, .pill.completed, .pill.delivered { background: #e6e9ec; color: #4b5560; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .mini { padding: 6px 10px; font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); cursor: pointer; white-space: nowrap; }
    .mini:hover { border-color: var(--brass); }
    .mini.danger { color: var(--bad); }
    .mini.primary { background: var(--forest); color: var(--cream); border-color: var(--forest); }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: end; }
    .filters .field { min-width: 160px; }
    .addform { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
    .admin-cal .cal th, .admin-cal .cal td button { color: var(--ink); }
    .admin-cal .cal thead th, .admin-cal .cal thead th b { color: var(--ink); }
    .admin-cal .cal-wrap, .admin-cal .cal th, .admin-cal .cal td { border-color: var(--line); }
    .admin-cal .cal td button { border-left-color: var(--line); }
    .admin-cal .cal tbody th small { color: var(--brass); }
    .admin-cal .cal td button.full { color: var(--bad); }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 14px; }
      aside .brand { width: 100%; margin-bottom: 8px; }
      aside .spacer { display: none; }
      .two { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="login" id="login">
    <div class="login-bg" aria-hidden="true"></div>
    <canvas id="loginRain" aria-hidden="true"></canvas>
    <form class="login-card" id="loginForm" autocomplete="on">
      <svg class="login-mark" viewBox="0 0 64 64" aria-hidden="true"><path class="d1" d="M32 6c9 14 16 23 16 33a16 16 0 0 1-32 0c0-10 7-19 16-33z"/><path class="d2" d="M32 26v28M32 38l-8-7M32 44l8-7"/></svg>
      <p class="eyebrow">Staff only</p>
      <h1>The Petrichor</h1>
      <p class="login-sub">Sign in to the dashboard</p>
      <label class="float">
        <input name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder=" " />
        <span>Username</span>
      </label>
      <label class="float pw">
        <input name="password" type="password" required autocomplete="current-password" placeholder=" " id="pwInput" />
        <span>Password</span>
        <button type="button" class="peek" id="peek" aria-label="Show password for 3 seconds" title="Show for 3 seconds">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="eye" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle class="pupil" cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg>
        </button>
        <i class="peek-bar" id="peekBar"></i>
      </label>
      <p class="caps" id="caps" hidden>Caps Lock is on</p>
      <button class="btn login-go" id="loginGo"><span>Sign in</span><i class="spinner"></i></button>
      <div class="error" id="loginError" role="alert"></div>
      <p class="login-foot"><a href="/">← Back to the website</a></p>
    </form>
  </div>

  <div class="shell" id="shell" style="display:none">
    <aside>
      <div class="brand">THE PETRICHOR<small>Staff dashboard</small></div>
      <p class="who" id="who"></p>
      <button class="navi" data-view="overview">Overview</button>
      <button class="navi" data-view="calendar">Room availability</button>
      <button class="navi" data-view="bookings">Room bookings</button>
      <button class="navi" data-view="rooms">Rooms &amp; rates</button>
      <button class="navi" data-view="reservations">Table bookings</button>
      <button class="navi" data-view="tables">Tables</button>
      <button class="navi" data-view="enquiries">Event enquiries</button>
      <button class="navi" data-view="venues">Grounds &amp; venues</button>
      <button class="navi" data-view="orders">Delivery orders</button>
      <button class="navi" data-view="payments">M-Pesa payments</button>
      <button class="navi" data-view="menu">Menu &amp; prices</button>
      <button class="navi" data-view="delivery">Delivery settings</button>
      <button class="navi" data-view="accounts" id="navAccounts" hidden>Staff accounts</button>
      <div class="spacer"></div>
      <a class="navi" href="/" style="color:rgba(244,239,228,.6);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:11px 14px;text-decoration:none">View website</a>
      <button class="navi" id="logout">Sign out</button>
    </aside>
    <main id="view"></main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/admin.js"></script>
</body>
</html>
